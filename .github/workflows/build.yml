name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk libffi-dev libssl-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" "buildozer==1.5.0" kivy

      - name: Generar buildozer.spec
        run: |
          buildozer init
          sed -i 's/title = My Application/title = EcuBot/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = ecubot/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.ecuador/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

      - name: Compilar APK
        run: |
          yes | buildozer -v android debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v3
        with:
          name: EcuBot-APK
          path: bin/*.apk
